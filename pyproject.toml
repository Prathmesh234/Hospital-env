[project]
name = "hospital-env"
version = "0.1.0"
description = "A complex synthetic hospital information system environment backed by PostgreSQL (+ optional MongoDB), exposed via FastAPI, seeded from xlsx files."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prathmesh Bhatt" }]
license = { text = "MIT" }
keywords = ["hospital", "ehr", "fhir", "fastapi", "sqlalchemy", "postgres", "synthetic-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pymongo>=4.10.1",
    "motor>=3.6.0",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "httpx>=0.28.1",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[project.scripts]
hospital-env = "setup.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setup", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer/fastapi declare params via function-call defaults by design
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
